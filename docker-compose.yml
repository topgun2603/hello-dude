# Local development services. Ports are offset from the defaults so they never
# clash with a Postgres/Redis already installed on the machine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pesu
      POSTGRES_PASSWORD: pesu
      POSTGRES_DB: pesu
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesu"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:

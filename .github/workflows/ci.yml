# Tests on every push and pull request. Deploys are manual for now
# (docker compose on the VPS, see infra/docker-compose.prod.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pesu, POSTGRES_PASSWORD: pesu, POSTGRES_DB: pesu }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pesu" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://pesu:pesu@localhost:5432/pesu_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run: { working-directory: services/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/api/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  admin:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/admin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  images:
    runs-on: ubuntu-latest
    needs: [api, admin]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t hellodude-api .
      - run: docker build -f apps/admin/Dockerfile -t hellodude-admin .

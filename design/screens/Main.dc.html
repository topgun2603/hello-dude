class Component extends DCLogic {

      { id: 'other', label: 'Other', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8.5 12h7' }
    ];
    const genders = opts.map((o) => {
      const on = this.state.gender === o.id;
      return {
        label: o.label,
        icon: o.icon,
        on,
        pressed: on ? 'true' : 'false',
        border: on ? '#EC4899' : 'rgba(255,255,255,0.2)',
        bg: on ? 'rgba(236,72,153,0.16)' : 'transparent',
        iconColor: on ? '#F9A8D4' : '#93C5FD',
        pick: () => this.setState({ gender: o.id })
      };
    });
    return { genders };
  }
}

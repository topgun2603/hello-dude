<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earnings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0A18;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#FFFFFF}
a{color:#6EE7B7}a:hover{color:#A7F3D0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 110% 6%, rgba(16,185,129,0.3), transparent 30%), radial-gradient(circle at -14% 60%, rgba(124,58,237,0.4), transparent 32%), #0A0A18; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; color: #FFFFFF;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px;">
    <a href="CompanionHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 20px;">Earnings</h1>
    <div style="width: 44px;"></div>
  </div>

  <div style="margin-top: 16px; padding: 18px 20px; border-radius: 26px; position: relative; overflow: hidden; background: linear-gradient(130deg, #047857, #0E7490 60%, #6D28D9); box-shadow: 0 16px 40px rgba(16,185,129,0.25);">
    <div style="position: absolute; right: -36px; top: -44px; width: 150px; height: 150px; border-radius: 75px; border: 1.5px solid rgba(255,255,255,0.2);"></div>
    <div style="font-size: 13px; font-weight: 600; color: #D1FAE5;">Available to withdraw</div>
    <div style="margin-top: 4px; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -1px;">₹1,240</div>
    <div style="margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(10,10,24,0.3); display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M5 10V20M19 10V20M9 14v3M15 14v3M3 20h18M12 3l9 5H3z"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 12px; color: #D1FAE5;">Pay to UPI</span>
        <span style="font-size: 14.5px; font-weight: 700;">priya••••@okaxis</span>
      </span>
      <a href="#" style="font-size: 13.5px; font-weight: 700; color: #FFFFFF;">Change</a>
    </div>
  </div>

  <button type="button" style="margin-top: 14px; height: 54px; border: 0; border-radius: 27px; background: linear-gradient(90deg, #059669, #0E7490 55%, #7C3AED); color: #FFFFFF; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-size: 16.5px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 28px rgba(16,185,129,0.3);">Withdraw ₹1,240</button>
  <div style="margin-top: 8px; text-align: center; font-size: 12.5px; color: #C9C5DD;">TDS is deducted before payout. Download statements in Settings.</div>

  <div style="margin-top: 20px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 700; font-size: 17px;">This week</div>
    <div style="font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; color: #6EE7B7;">₹1,062</div>
  </div>
  <div style="margin-top: 10px; height: 130px; box-sizing: border-box; padding: 14px 14px 10px; border-radius: 20px; background: rgba(22,20,44,0.78); border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end;">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%;">
        <div style="font-size: 10.5px; font-weight: 600; color: #C9C5DD;">{{b.value}}</div>
        <div style="width: 100%; height: {{b.h}}; border-radius: 8px; background: {{b.bg}};"></div>
        <div style="font-size: 11.5px; font-weight: 600; color: {{b.labelColor}};">{{b.day}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: 20px; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 700; font-size: 17px;">Withdrawals</div>
  <div style="margin-top: 10px; border-radius: 20px; background: rgba(22,20,44,0.78); border: 1px solid rgba(255,255,255,0.08); padding: 2px 14px;">
    <sc-for list="{{payouts}}" as="p" hint-placeholder-count="3">
      <div style="height: 58px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid {{p.divider}};">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 14.5px; font-weight: 600;">{{p.amount}}</span>
          <span style="font-size: 12.5px; color: #C9C5DD;">{{p.sub}}</span>
        </span>
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; display: flex; align-items: center; font-size: 12px; font-weight: 700;">{{p.status}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const week = [
      { day: 'M', v: 120 }, { day: 'T', v: 96 }, { day: 'W', v: 210 },
      { day: 'T', v: 168 }, { day: 'F', v: 282 }, { day: 'S', v: 0 }, { day: 'S', v: 186 }
    ];
    const max = 282;
    const bars = week.map((d, i) => {
      const today = i === 6;
      return {
        day: d.day,
        value: d.v ? '₹' + d.v : '–',
        h: Math.max(4, Math.round((d.v / max) * 60)) + 'px',
        bg: today ? 'linear-gradient(180deg, #6EE7B7, #059669)' : (d.v ? 'rgba(196,181,253,0.55)' : 'rgba(255,255,255,0.12)'),
        labelColor: today ? '#6EE7B7' : '#A8A4C4'
      };
    });
    const rows = [
      { amount: '₹990 received', sub: '15 Sep · ₹1,000 minus ₹10 TDS', status: 'Paid' },
      { amount: '₹495 received', sub: '8 Sep · ₹500 minus ₹5 TDS', status: 'Paid' },
      { amount: '₹300', sub: '1 Sep · UPI rejected, returned to balance', status: 'Failed' }
    ];
    const styles = {
      Paid: { bg: 'rgba(52,211,153,0.18)', fg: '#6EE7B7' },
      Failed: { bg: 'rgba(251,113,133,0.18)', fg: '#FDA4AF' }
    };
    const payouts = rows.map((r, i) => ({
      amount: r.amount, sub: r.sub, status: r.status,
      badgeBg: styles[r.status].bg, badgeFg: styles[r.status].fg,
      divider: i === rows.length - 1 ? 'transparent' : 'rgba(255,255,255,0.08)'
    }));
    return { bars, payouts };
  }
}
</script>
</body>
</html>

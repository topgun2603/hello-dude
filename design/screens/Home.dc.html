<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@600&amp;display=swap">
<style>
body{margin:0;background:#0A0A18;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#FFFFFF}
a{color:#F9A8D4}a:hover{color:#FBCFE8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 0; position: relative; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 112% 8%, rgba(236,72,153,0.4), transparent 30%), radial-gradient(circle at -14% 55%, rgba(124,58,237,0.45), transparent 32%), #0A0A18; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; color: #FFFFFF;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 38px; height: 38px; border-radius: 19px; background: linear-gradient(135deg, #7C3AED, #DB2777 55%, #F97316); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
      </div>
      <div style="font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 21px;">Pesu</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="#" aria-label="Coin balance 0, add coins" style="height: 40px; padding: 0 6px 0 10px; border-radius: 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; gap: 8px; text-decoration: none; color: #FFFFFF; font-weight: 700; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F59E0B"></circle><circle cx="12" cy="12" r="6.5" fill="none" stroke="#FDE68A" stroke-width="1.6"></circle><path d="M12 8.5v7" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round"></path></svg>
        0
        <span style="width: 28px; height: 28px; border-radius: 14px; background: linear-gradient(135deg, #DB2777, #EA580C); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
      </a>
      <button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"></path></svg>
      </button>
    </div>
  </div>

  <div style="margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.6px;">Vanakkam!</h1>
      <div style="font-size: 14.5px; color: #D4D0E6;">Who do you want to talk to today?</div>
    </div>
    <button type="button" aria-label="Change language, current Tamil" style="height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(192,132,252,0.16); border: 1px solid rgba(192,132,252,0.45); color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: 'Noto Sans Tamil', 'Figtree', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0;">
      தமிழ்
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E9D5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <div style="margin-top: 18px; height: 196px; box-sizing: border-box; padding: 20px; border-radius: 28px; position: relative; overflow: hidden; background: linear-gradient(125deg, #6D28D9, #C026D3 55%, #EA580C); box-shadow: 0 16px 40px rgba(192,38,211,0.35); display: flex; flex-direction: column;">
    <div style="position: absolute; right: -40px; top: -30px; width: 170px; height: 170px; border-radius: 85px; border: 1.5px solid rgba(255,255,255,0.22);"></div>
    <div style="position: absolute; right: -10px; top: 0px; width: 110px; height: 110px; border-radius: 55px; border: 1.5px solid rgba(255,255,255,0.3);"></div>
    <svg style="position: absolute; right: 18px; top: 26px;" width="56" height="44" viewBox="0 0 56 44" fill="none" aria-hidden="true"><path d="M4 18v8M14 10v24M24 2v40M34 8v28M44 14v16M52 19v6" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"></path></svg>
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #FCE7F3;">Instant match</div>
    <div style="margin-top: 6px; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.15; letter-spacing: -0.5px; max-width: 230px;">Talk to someone now</div>
    <div style="margin-top: 6px; font-size: 14px; line-height: 1.4; color: #FDF2F8; max-width: 250px;">We'll connect you with an online Tamil speaker in seconds.</div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; gap: 10px;">
      <button type="button" style="flex-grow: 1; height: 46px; border: 0; border-radius: 23px; background: #FFFFFF; color: #4C1D95; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Figtree', 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4C1D95" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        Voice call
      </button>
      <button type="button" style="flex-grow: 1; height: 46px; border-radius: 23px; border: 1.5px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Figtree', 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="3"></rect><path d="M16 10.5l6-3.5v10l-6-3.5"></path></svg>
        Video call
      </button>
    </div>
  </div>

  <div style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 8px; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 700; font-size: 17px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #34D399; box-shadow: 0 0 0 4px rgba(52,211,153,0.2);"></span>
      Online now
    </div>
    <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none;">See all</a>
  </div>

  <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <div style="height: 70px; box-sizing: border-box; padding: 0 12px; border-radius: 20px; background: rgba(22,20,44,0.78); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px;">
        <div style="position: relative; width: 46px; height: 46px; flex-shrink: 0;">
          <div style="width: 46px; height: 46px; border-radius: 23px; background: {{p.grad}}; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 18px; color: #FFFFFF;">{{p.initial}}</div>
          <span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 6px; background: {{p.dot}}; border: 2px solid #16142C;"></span>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 700; font-size: 15.5px;">{{p.name}}</div>
          <div style="font-size: 13px; color: {{p.statusColor}};">{{p.status}}</div>
        </div>
        <button type="button" aria-label="{{p.voiceLabel}}" disabled="{{p.busy}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{p.voiceBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg>
        </button>
        <button type="button" aria-label="{{p.videoLabel}}" disabled="{{p.busy}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.videoStroke}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="3"></rect><path d="M16 10.5l6-3.5v10l-6-3.5"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; box-sizing: border-box; padding: 8px 20px 14px; background: rgba(12,11,28,0.96); border-top: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}}; font-size: 12px; font-weight: 600;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: 'Priya', grad: 'linear-gradient(135deg, #EC4899, #9333EA)', busy: false },
      { name: 'Kavya', grad: 'linear-gradient(135deg, #3B82F6, #6D28D9)', busy: false },
      { name: 'Divya', grad: 'linear-gradient(135deg, #F97316, #DB2777)', busy: true },
      { name: 'Meena', grad: 'linear-gradient(135deg, #10B981, #0E7490)', busy: false }
    ];
    const people = raw.map((p) => ({
      name: p.name,
      initial: p.name[0],
      grad: p.grad,
      busy: p.busy,
      dot: p.busy ? '#F59E0B' : '#34D399',
      status: p.busy ? 'In a call' : 'Tamil · English',
      statusColor: p.busy ? '#FCD34D' : '#C9C5DD',
      voiceBg: p.busy ? 'rgba(255,255,255,0.12)' : 'linear-gradient(135deg, #7C3AED, #DB2777)',
      videoStroke: p.busy ? '#8E8AA8' : '#FFFFFF',
      voiceLabel: 'Voice call ' + p.name,
      videoLabel: 'Video call ' + p.name
    }));
    const tabDefs = [
      { label: 'Home', icon: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { label: 'Calls', icon: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' },
      { label: 'Wallet', icon: 'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M16 14h2' },
      { label: 'Profile', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-7 8-7s8 3 8 7' }
    ];
    const tabs = tabDefs.map((t, i) => ({
      label: t.label,
      icon: t.icon,
      color: i === 0 ? '#F472B6' : '#A8A4C4',
      current: i === 0 ? 'page' : 'false'
    }));
    return { people, tabs };
  }
}
</script>
</body>
</html>

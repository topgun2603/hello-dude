<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify number</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#0A0A18;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#FFFFFF}
a{color:#F9A8D4}a:hover{color:#FBCFE8}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 26px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 110% 12%, rgba(236,72,153,0.5), transparent 32%), radial-gradient(circle at -12% 70%, rgba(124,58,237,0.55), transparent 34%), #0A0A18; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; color: #FFFFFF;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px;">
    <a href="Main.dc.html" aria-label="Back" style="width: 46px; height: 46px; border-radius: 23px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; gap: 8px;" aria-label="Step 1 of 3">
      <div style="width: 8px; height: 8px; border-radius: 4px; background: #C084FC;"></div>
      <div style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22);"></div>
      <div style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22);"></div>
    </div>
    <div style="width: 46px;"></div>
  </div>

  <div style="margin-top: 34px; height: 170px; display: flex; align-items: center; justify-content: center; position: relative;">
    <div style="position: absolute; width: 170px; height: 170px; border-radius: 85px; border: 1px solid rgba(192,132,252,0.25);"></div>
    <div style="position: absolute; width: 130px; height: 130px; border-radius: 65px; border: 1px solid rgba(244,114,182,0.35);"></div>
    <div style="width: 92px; height: 92px; border-radius: 30px; background: linear-gradient(135deg, #7C3AED, #DB2777 60%, #F97316); display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); box-shadow: 0 14px 40px rgba(219,39,119,0.5);">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path><path d="M8.8 12.2l2.2 2.2 4.2-4.4"></path></svg>
    </div>
  </div>

  <h1 style="margin: 30px 0 0; text-align: center; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: -0.8px;">Enter the <span style="background: linear-gradient(90deg, #FB923C, #F472B6 50%, #C084FC); -webkit-background-clip: text; background-clip: text; color: transparent;">6-digit code</span></h1>
  <p style="margin: 10px 0 0; text-align: center; font-size: 15px; line-height: 1.5; color: #D4D0E6;">Sent to <span style="color: #FFFFFF; font-weight: 600;">+91 98765 43210</span> · <a href="Main.dc.html">Edit</a></p>

  <div role="group" aria-label="Verification code" style="margin-top: 28px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="{{b.label}}" value="{{b.value}}" readonly="{{ true }}" style="height: 58px; min-width: 0; box-sizing: border-box; text-align: center; border-radius: 16px; border: 1.5px solid {{b.border}}; background: {{b.bg}}; color: #FFFFFF; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700;">
    </sc-for>
  </div>

  <div style="margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #C9C5DD;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
    Resend code in <span style="color: #FFFFFF; font-weight: 600;">0:24</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 14px 16px; border-radius: 18px; background: rgba(22,20,44,0.78); border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 12px; align-items: flex-start;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    <div style="font-size: 13.5px; line-height: 1.45; color: #D4D0E6;">Your number stays private. Others only see your avatar and first name.</div>
  </div>

  <a href="Language.dc.html" style="margin-top: 16px; height: 56px; border-radius: 28px; background: linear-gradient(90deg, #7C3AED, #DB2777 55%, #EA580C); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; font-size: 17px; font-weight: 700; text-decoration: none; box-shadow: 0 10px 28px rgba(219,39,119,0.4);">
    Verify
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const digits = ['4', '8', '2', '7', '', ''];
    const boxes = digits.map((d, i) => {
      const active = i === 4;
      return {
        value: d,
        label: 'Digit ' + (i + 1),
        border: active ? '#EC4899' : (d ? 'rgba(192,132,252,0.55)' : 'rgba(255,255,255,0.18)'),
        bg: active ? 'rgba(236,72,153,0.14)' : 'rgba(22,20,44,0.78)'
      };
    });
    return { boxes };
  }
}
</script>
</body>
</html>
